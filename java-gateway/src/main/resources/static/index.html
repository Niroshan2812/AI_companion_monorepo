<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Companion</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-bubble: #2563eb;
            --ai-bubble: rgba(30, 41, 59, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e3a8a 0%, transparent 40%),
                radial-gradient(circle at bottom left, #0f766e 0%, transparent 40%);
            color: var(--text-main);
            height: 100vh;
            /* Fallback for older browsers */
            height: 100dvh;
            /* Dynamic viewport height to prevent mobile UI from hiding the input box */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Authentication Modal */
        #auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .glass-panel h2 {
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .glass-panel input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            margin-bottom: 1rem;
            outline: none;
        }

        .glass-panel button {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .glass-panel button:active {
            transform: scale(0.98);
        }

        /* Chat Interface */
        header {
            padding: 1.5rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 0.95rem;
            color: var(--primary);
            margin-top: 4px;
            font-weight: 500;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.5;
            font-size: 1.05rem;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            word-wrap: break-word;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .user {
            align-self: flex-end;
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }

        .ai {
            align-self: flex-start;
            background: var(--ai-bubble);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
            white-space: pre-wrap;
            /* Preserve newlines from LLM */
        }

        /* Input Area */
        #input-area {
            padding: 1rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }

        #message-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 14px 22px;
            color: white;
            font-size: 1.1rem;
            outline: none;
        }

        #message-input:focus {
            border-color: var(--primary);
        }

        #send-btn {
            background: var(--primary);
            border: none;
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        #send-btn:active {
            transform: scale(0.9);
        }

        #send-btn svg {
            fill: white;
            width: 20px;
            height: 20px;
            margin-left: 3px;
        }
    </style>
</head>

<body>

    <!-- Auth Modal -->
    <div id="auth-modal">
        <div class="glass-panel">
            <h2>Welcome</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Please paste your testing JWT
                token</p>
            <input type="text" id="jwt-input" placeholder="eyJhbGciOiJIUzUxMiJ9...">
            <button onclick="saveTokenAndConnect()">Connect</button>
        </div>
    </div>

    <!-- Main Chat -->
    <header>
        <h1>AI Companion</h1>
        <p id="status-text">Disconnected</p>
        <select id="engineToggle" onchange="switchEngine()"
            style="padding: 5px; border-radius: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
            <option value="V1_BUMP" style="color: black;">V1: BUMP (Emotion)</option>
            <option value="V2_QLEARNING" style="color: black;">V2: Q-Learning (RL)</option>
        </select>
    </header>

    <div id="chat-container"></div>

    <div id="input-area">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
        </button>
    </div>

    <script>
        let ws;
        let currentAiBubble = null;
        let aiTypingTimeout = null;

        const authModal = document.getElementById('auth-modal');
        const jwtInput = document.getElementById('jwt-input');
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const statusText = document.getElementById('status-text');

        // Check if token exists in local storage
        window.onload = () => {
            const savedToken = localStorage.getItem('companion_jwt');
            if (savedToken) {
                authModal.style.display = 'none';
                connectWebSocket(savedToken);
            }
        };

        function saveTokenAndConnect() {
            const token = jwtInput.value.trim();
            if (!token) return;
            localStorage.setItem('companion_jwt', token);
            authModal.style.display = 'none';
            connectWebSocket(token);
        }

        function connectWebSocket(token) {
            statusText.innerText = "Connecting...";
            statusText.style.color = "var(--text-muted)";

            // Dynamically get the current IP so it works on mobile
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host; // e.g. 192.168.1.100:8080
            const wsUrl = `${protocol}//${host}/ws/companion?token=${token}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusText.innerText = "Online";
                statusText.style.color = "#10b981"; // Emerald green
            };

            ws.onmessage = (event) => {
                const tokenText = event.data;

                // Proactive messages usually arrive as an entirely new payload starting with newlines
                if (tokenText.includes("[Proactive Check-in]")) {
                    currentAiBubble = null; // Force a new bubble
                }

                // If we don't have an active AI bubble, create one
                if (!currentAiBubble) {
                    currentAiBubble = document.createElement('div');
                    currentAiBubble.className = 'message ai';
                    chatContainer.appendChild(currentAiBubble);
                }

                // Append the incoming token text
                currentAiBubble.innerText += tokenText;
                scrollToBottom();

                // If the stream pauses for more than 2 seconds, assume it's done typing and break the bubble
                clearTimeout(aiTypingTimeout);
                aiTypingTimeout = setTimeout(() => {
                    currentAiBubble = null;
                }, 2000);
            };

            ws.onclose = () => {
                statusText.innerText = "Disconnected";
                statusText.style.color = "#ef4444"; // Red
                // Attempt reconnect after 5 seconds
                setTimeout(() => connectWebSocket(token), 5000);
            };

            ws.onerror = (err) => {
                console.error("WebSocket error", err);
            };
        }

        function switchEngine() {
            const mode = document.getElementById("engineToggle").value;
            // Assuming your token is still valid from the initial page load
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            // Note: Since JWT validation handles userId internally, 
            // you might want to hardcode the UUID here temporarily if your frontend 
            // doesn't know its own UUID yet, OR update the controller to read the JWT!
            // For testing purposes, paste your testing UUID here:
            const testUserId = "91e925c6-5cb1-4b0d-88a9-62d1201675e7";

            fetch(`/api/settings/mode?userId=${testUserId}&mode=${mode}`, {
                method: 'POST'
            }).then(() => {
                appendMessage("System", "Engine successfully switched to: " + mode);
            }).catch(err => console.error("Toggle error", err));
        }


        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            // Create User Bubble
            const userBubble = document.createElement('div');
            userBubble.className = 'message user';
            userBubble.innerText = text;
            chatContainer.appendChild(userBubble);

            // Send over WebSocket
            ws.send(text);

            // Clear input and prep for AI response
            messageInput.value = '';
            currentAiBubble = null; // Force next incoming token into a new bubble
            scrollToBottom();
        }

        // Allow sending with Enter key
        messageInput.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>

</html>
